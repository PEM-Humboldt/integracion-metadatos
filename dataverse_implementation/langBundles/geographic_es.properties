datasetfieldtype.spatialRepresentationType.description=M\u00e9todo utilizado para representar la informaci\u00f3n geogr\u00e1fica del conjunto de datos (vectorial, r\u00e1ster u otro, por ejemplo tablas). Seleccione un valor por cada tipo presente.
datasetfieldtype.topicCategory.description=Clasificaci\u00f3n tem\u00e1tica general del conjunto de datos seg\u00fan ISO 19115. Seleccione un valor por categor\u00eda.
datasetfieldtype.presentationForm.description=Forma en que se presenta el conjunto de datos: mapa digital, imagen digital, modelo\u2026
datasetfieldtype.geogPurpose.description=Resumen de las intenciones con las que se elabor\u00f3 el conjunto de datos.
datasetfieldtype.geogDatasetStatus.description=Estado de avance del conjunto de datos (finalizado, en curso, obsoleto\u2026).
datasetfieldtype.maintenanceAndUpdateFrequency.description=Frecuencia con la que se modifica o completa el conjunto de datos una vez finalizado.
datasetfieldtype.geogDateRange.description=Periodo al que se refieren los datos geogr\u00e1ficos. Para una sola fecha, use la misma fecha de inicio y de finalizaci\u00f3n.
datasetfieldtype.geogStartDate.description=Fecha de inicio del periodo (AAAA-MM-DD, AAAA-MM o AAAA).
datasetfieldtype.geogEndDate.description=Fecha de finalizaci\u00f3n del periodo (AAAA-MM-DD, AAAA-MM o AAAA).
datasetfieldtype.geogSoftware.description=Software utilizado para producir los datos geogr\u00e1ficos. Una entrada por programa.
datasetfieldtype.geogSoftwareName.description=Nombre del software. Una entrada por programa.
datasetfieldtype.geogSoftwareVersion.description=Versi\u00f3n del software.
datasetfieldtype.referenceSystemIdentifier.description=Datos vectoriales y r\u00e1ster: c\u00f3digo num\u00e9rico de la autoridad EPSG del sistema de referencia de coordenadas del conjunto de datos. Si el conjunto de datos usa varios sistemas, un valor por sistema.
datasetfieldtype.distributionFormat.description=Datos vectoriales y r\u00e1ster: formato en el que se entregan los datos geogr\u00e1ficos de este conjunto de datos. Un valor por formato. Los servicios web (WMS, WFS\u2026) se describen como referencia externa, no aqu\u00ed.
datasetfieldtype.geogOnlineService.description=Datos vectoriales y r\u00e1ster: solo para el caso particular en que los datos se publican como servicio web, no como archivos: tipo del servicio. Los formatos de los archivos van en \u00abFormato de distribuci\u00f3n\u00bb y la direcci\u00f3n (URL) del servicio en \u00abReferencias externas\u00bb.
datasetfieldtype.equivalentScale.description=Solo datos vectoriales: denominador de la escala de los datos vectoriales. Si los datos tienen varias escalas, un valor por escala.
datasetfieldtype.topologyLevel.description=Solo datos vectoriales: grado de complejidad de las relaciones topol\u00f3gicas de los datos vectoriales. Si los datos no tienen reglas topol\u00f3gicas (caso m\u00e1s com\u00fan: shapefile, geopackage), elija \u00abSolo geometr\u00eda\u00bb. Si las capas tienen niveles distintos, indique el m\u00e1s completo.
datasetfieldtype.geometricObjects.description=Solo datos vectoriales: tipo y n\u00famero de los objetos geom\u00e9tricos de los datos vectoriales. Una entrada por tipo de geometr\u00eda.
datasetfieldtype.geometricObjectType.description=Solo datos vectoriales: tipo de los objetos geom\u00e9tricos (punto, curva, superficie\u2026). Si los datos tienen varios tipos de geometr\u00eda, una entrada por tipo.
datasetfieldtype.geometricObjectCount.description=Solo datos vectoriales: n\u00famero de objetos geom\u00e9tricos (entidades) de este tipo en todo el conjunto de datos (suma de todas las capas de este tipo).
datasetfieldtype.resolutionDistance.description=Solo datos r\u00e1ster: tama\u00f1o de una celda sobre el terreno. Si los datos tienen varias resoluciones, una entrada por resoluci\u00f3n.
datasetfieldtype.resolutionDistanceValue.description=Solo datos r\u00e1ster: tama\u00f1o de una celda sobre el terreno en un eje, en la unidad indicada en \u00abUnidad\u00bb.
datasetfieldtype.resolutionDistanceUnit.description=Solo datos r\u00e1ster: unidad de la resoluci\u00f3n espacial.
datasetfieldtype.coverageDescription.description=Solo datos r\u00e1ster: qu\u00e9 representan los valores de las celdas, con un tipo de contenido y una descripci\u00f3n. Una entrada por tipo de contenido.
datasetfieldtype.coverageContentType.description=Solo datos r\u00e1ster: tipo de informaci\u00f3n que representan los valores de las celdas de los datos en grilla: imagen, clasificaci\u00f3n tem\u00e1tica o medici\u00f3n f\u00edsica.
datasetfieldtype.attributeDescription.description=Solo datos r\u00e1ster: qu\u00e9 representan los valores de las celdas de los datos en grilla: variable y unidad, bandas.
datasetfieldtype.satelliteScene.description=Solo datos r\u00e1ster, im\u00e1genes satelitales: sistema de grilla y path/row de cada escena. Una entrada por escena.
datasetfieldtype.pathrowReference.description=Solo datos r\u00e1ster: sistema de grilla en el que se expresan el path y el row.
datasetfieldtype.pathrow.description=Solo datos r\u00e1ster: path (franja de paso del sat\u00e9lite) y row (fila de la escena en esa franja).
datasetfieldtype.gridSpatialRepresentation.description=Solo datos r\u00e1ster: propiedades t\u00e9cnicas de la grilla. Si los r\u00e1sters tienen estructuras distintas, describa el principal.
datasetfieldtype.numberOfDimensions.description=Solo datos r\u00e1ster: n\u00famero de ejes espacio-temporales independientes. 2 para un r\u00e1ster com\u00fan (x, y); 3 si incluye tiempo o altura.
datasetfieldtype.cellGeometry.description=Solo datos r\u00e1ster: indica si los valores de la grilla representan puntos o superficies. Superficie en casi todos los casos (cada celda cubre un \u00e1rea); Punto si cada valor corresponde a un punto, por ejemplo el centro de la celda.
datasetfieldtype.transformationParameterAvailability.description=Solo datos r\u00e1ster: indica si existen (est\u00e1n disponibles) los par\u00e1metros de transformaci\u00f3n entre coordenadas de la imagen y coordenadas geogr\u00e1ficas o del mapa.
datasetfieldtype.geographicQualityControl.description=Descripci\u00f3n de las pruebas de calidad aplicadas a los datos geogr\u00e1ficos: validaci\u00f3n topol\u00f3gica, exactitud posicional y tem\u00e1tica, completitud. Puede ser un texto parecido a la secci\u00f3n de m\u00e9todos de un art\u00edculo cient\u00edfico. El historial de producci\u00f3n va en \u00abLinaje\u00bb.
datasetfieldtype.lineage.description=Explicaci\u00f3n general de las fuentes y de los procesos de producci\u00f3n del conjunto de datos, incluidas las referencias de las fuentes utilizadas.
datasetfieldtype.geographicBiases.description=Describe los sesgos potenciales del conjunto de datos. Pensando en el \u00abuniverso\u00bb estudiado, \u00bfcu\u00e1les son los sesgos espaciales, temporales, estad\u00edsticos, sociales y cient\u00edficos que provienen de la metodolog\u00eda particular utilizada para crear este conjunto de datos? \u00bfCu\u00e1les son los riesgos potenciales de pensar que este conjunto de datos es completo y representativo de su objeto de estudio?
datasetfieldtype.illustration.description=Imagen que muestra el conjunto de datos, normalmente un mapa peque\u00f1o. Una entrada por imagen. Se conserva hasta que se decida c\u00f3mo manejar las miniaturas de los datasets en todos los cat\u00e1logos.
datasetfieldtype.illustrationFile.description=Direcci\u00f3n (URL) de la imagen. En las fichas migradas desde GeoNetwork, el enlace original: deja de funcionar cuando se retire GeoNetwork, por lo que hay que conservar la imagen.
datasetfieldtype.illustrationDescription.description=Leyenda corta de la imagen.
datasetfieldtype.illustrationFormat.description=Formato del archivo de la imagen.
