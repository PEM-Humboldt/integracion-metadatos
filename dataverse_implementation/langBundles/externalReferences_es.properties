datasetfieldtype.externalReference.description=Grupo de variables para describir una referencia a un documento, archivo, o conjunto de datos externos, relacionados con el conjunto de datos objeto de esta publicaci\u00f3n.
datasetfieldtype.externalReferenceType.description=Tipo de referencia  del conjunto de datos en repositorio externos:\nCitaci\u00f3n: documenta casos de uso de este conjunto de datos (por ejemplo: el Atlas de mam\u00edferos).\nReferencia biobliogr\u00e1fica: un documento que complementa este conjunto de datos (por ejemplo: un articulo cientifico que describe la metodolog\u00eda).\nConjunto de datos relacionado: un conjunto de datos que se puede relacionar en este cat\u00e1logo u otra (ubicaci\u00f3n, tem\u00e1tica, metodolog\u00eda, etc.).\nDuplicado del conjunto de datos: copia del conjunto de datos objeto de la publicaci\u00f3n en otro repositorio o cat\u00e1logo.\n
datasetfieldtype.citationText.description=Citaci\u00f3n de la referencia externa.  En caso de que el formato de una citaci\u00f3n bibliogr\u00e1fica no aplique, puede ser un t\u00edtulo. 
