datasetfieldtype.accessType.description=Tipo de acceso y restricciones de uso del conjunto de datos:\n1. Libre a nivel externo e interno: La I2D podr\u00e1 compartir la informaci\u00f3n a entidades externas e investigadores del IAvH sin ninguna restricci\u00f3n en los cat\u00e1logos institucionales. \n2. Libre a nivel interno: La I2D podr\u00e1 compartir la informaci\u00f3n \u00fanicamente a investigadores del IAvH sin ninguna restricci\u00f3n.\n3. Restricci\u00f3n temporal: La I2D se compromete a no compartir la informaci\u00f3n por un tiempo definido.\n
