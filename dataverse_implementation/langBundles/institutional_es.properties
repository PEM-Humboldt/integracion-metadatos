controlledvocabulary.restrictionJustification.1._to_protect_the_privacy_and_habeas_data_of_individuals=1. Para proteger la intimidad y el habeas data de las personas
controlledvocabulary.restrictionJustification.2._to_protect_the_ownership_and_intellectual_property_rights_of_the_institute_and_its_researchers=2. Para proteger la titularidad y los derechos de propiedad intelectual del Instituto y sus investigadores
controlledvocabulary.restrictionJustification.3._to_protect_the_ownership_and/or_intellectual_property_rights_of_third_parties.=3. Para proteger la titularidad y/o los derechos de propiedad intelectual de terceros.
controlledvocabulary.restrictionJustification.4._to_protect_the_public_interest_in_line_with_legal_confidentiality_obligations_or_the_mission_of_the_institute=4. Para proteger el inter\u00e9s p\u00fablico en l\u00ednea con obligaciones de reserva legal o la misionalidad del Instituto
controlledvocabulary.restrictionJustification.5._to_protect_the_rights_of_indigenous_peoples,_ethnic_communities_and_local_communities_(while_a_data_governance_policy_for_this_type_of_collaboration_is_being_developed,_they_will_be_processed_as_exceptions).=5. Para proteger los derechos de los pueblos ind\u00edgenas, comunidades \u00e9tnicas y comunidades locales.
controlledvocabulary.restrictionJustification.6._to_protect_the_integrity_and_safety_of_the_people_involved_in_the_research_projects.=6. Para proteger la integridad y seguridad de las personas involucradas en los proyectos de investigaci\u00f3n.
controlledvocabulary.restrictionJustification.7._to_protect_the_integrity,_quality_and_replicability_of_the_institute's_research_results.=7. Para proteger la integridad, calidad y replicabilidad de los resultados de investigaci\u00f3n del Instituto.
controlledvocabulary.restrictionJustification.8._protect_the_institute's_liability_in_relation_to_third-party_data_in_its_possession.=8. Proteger la responsabilidad del Instituto en relaci\u00f3n con datos de terceros que est\u00e1n en su poder.
