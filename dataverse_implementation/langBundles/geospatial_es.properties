datasetfieldtype.geographicCoverage.description=Delimitaci\u00f3n espacial del conjunto de datos, indicando la zona, territorio o coordenadas geogr\u00e1ficas que comprende su contenido.
datasetfieldtype.geographicCoverageDescription.description=Descripci\u00f3n textual y detallada de la cobertura geogr\u00e1fica. Se puede ser tan espec\u00edfico como sea necesario.
datasetfieldtype.country.description=Nombre del pa\u00eds que delimita el contenido del conjunto de datos.
datasetfieldtype.state.description=Nombre del departamento que delimita el contenido del conjunto de datos.
datasetfieldtype.city.description=Nombre del municipio que delimita el contenido del conjunto de datos.
datasetfieldtype.otherGeographicCoverage.description=Nivel inferior de agregaci\u00f3n geogr\u00e1fica que delimita el contenido del conjunto de datos.
datasetfieldtype.geographicUnit.description=Categor\u00eda geogr\u00e1fica que delimita el contenido del conjunto de datos. (ej: Pa\u00eds, Regi\u00f3n, Departamento, Municipio, Vereda, Corregimiento, Predio, Zona hidrogr\u00e1fica, etc.) 
datasetfieldtype.geographicBoundingBox.description=El rect\u00e1ngulo envolvente geogr\u00e1fico es la descripci\u00f3n geom\u00e9trica fundamental sobre cualquier conjunto de datos que representa a una zona geogr\u00e1fica. Describe el m\u00ednimo recuadro definido por sus longitudes este y oeste y por sus latitudes norte y sur, que incluye la mayor parte de la extensi\u00f3n geogr\u00e1fica cubierta por el recurso. Si el \u00e1rea geogr\u00e1fica abarca dos o m\u00e1s localidades aisladas, cubrir el \u00e1rea total, sin importar que incluya otras localidades que no hacen parte del \u00e1rea geogr\u00e1fica.
datasetfieldtype.westLongitude.description=Corresponde al punto m\u00e1s al occidente del \u00e1rea representada en los datos, expresado en longitud. Los valores deben ser ingresados en grados decimales con los valores limites est\u00e1ndares de longitud -180 a + 180 (occidente/oriente), con longitudes positivas al oriente del meridiano de Greenwich. 
datasetfieldtype.eastLongitude.description=Corresponde al punto m\u00e1s al oriente del \u00e1rea representada en los datos, expresado en longitud. Los valores deben ser ingresados en grados decimales con los valores limites est\u00e1ndares de longitud -180 a + 180 (occidente/oriente), con longitudes positivas al oriente del meridiano de Greenwich.
datasetfieldtype.northLatitude.description=Corresponde al punto m\u00e1s al sur del \u00e1rea representada en los datos, expresado en latitud. Los valores deben ser ingresados en grados decimales con los valores limites est\u00e1ndares de latitud -90 a + 90 (sur/norte), con latitudes positivas en el hemisferio norte.
datasetfieldtype.southLatitude.description=Corresponde al punto m\u00e1s al norte del \u00e1rea representada en los datos, expresado en latitud. Los valores deben ser ingresados en grados decimales con los valores limites est\u00e1ndares de latitud -90 a + 90 (sur/norte), con latitudes positivas en el hemisferio norte.
datasetfieldtype.altitudeRange.description=Rango de altitud registrado en el conjunto de datos.
datasetfieldtype.minimumAltitude.description=Altitud m\u00ednima en metros sobre el nivel del mar (puede ser negativa para profundidad marina).
datasetfieldtype.maximumAltitude.description=Altitude m\u00e1xima en metros sobre el nivel del mar (puede ser negativa para profundidad marina).
datasetfieldtype.wkt.description=Representaci\u00f3n textual de la delimitaci\u00f3n geogr\u00e1fica del conjunto de datos en formato WKT. 
