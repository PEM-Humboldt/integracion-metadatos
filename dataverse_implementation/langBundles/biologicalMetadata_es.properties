datasetfieldtype.emlShortName.description=Nombre corto que se usar\u00e1 para generar la URL del recurso en el cat\u00e1logo institucional.
datasetfieldtype.coreType.description=La naturaleza de los datos del recurso. Si el tipo de datos no corresponde a ninguna de las opciones disponibles (ej., filogenias, fichas de especies), seleccione \"otro\".
datasetfieldtype.subtype.description=El subtipo del recurso que mejor describa el conjunto de datos de acuerdo con las siguientes opciones:\n- *Autoridad Taxon\u00f3mica:* una lista de chequeo taxon\u00f3mica que es autoridad en su clasificaci\u00f3n y sinonimia.\n- *Autoridad Nomenclatural:* una lista de chequeo nomenclatural que es autoridad en los nombres y la informaci\u00f3n de publicaci\u00f3n.\n- *Inventario Tem\u00e1tico:* una lista de chequeo que se sirve de un tema para agrupar nombres, p. ej. par\u00e1sitos de elefantes.\n- *Inventario Regional:* una lista de chequeo que contiene una comunidad regional que agrupa nombres, p. ej. especies en un \u00e1rea protegida.\n- *Conjunto de Datos de Especies Globales:* una lista taxon\u00f3mica con cobertura geogr\u00e1fica global. Este subtipo es usado particularmente por Catalogue of Life para ensamblar sus agregados.\n- *Derivado del Registro Biol\u00f3gico:* una lista de chequeo taxon\u00f3mica que se deriva de los datos que provienen de registros biol\u00f3gicos.\n- *Ejemplar:* datos de los espec\u00edmenes. Posible colecci\u00f3n de museo.\n- *Observaci\u00f3n:* datos de observaciones. Posibles monitoreos y observaciones de campo.
datasetfieldtype.purpose.description=Cualquier informaci\u00f3n que no est\u00e9 descrita en los dem\u00e1s campos de los metadatos, p. ej.: historia del proyecto, publicaciones que han usado estos datos, informaci\u00f3n sobre datos relacionados publicados en otro lugar, etc.
datasetfieldtype.taxonomicCoverageDescription.description=Describa las categor\u00edas taxon\u00f3micas que mejor representan el recurso. No es necesario llegar a nivel de especie, puede incluir familias, \u00f3rdenes u otras categor\u00edas. Puede generar varias coberturas al nivel taxon\u00f3mico y cada cobertura taxon\u00f3mica tiene su propia descripci\u00f3n.
datasetfieldtype.taxonomicClassification.description=Una lista de los taxa representados en el conjunto de datos a un nivel de detalle particular, es decir, hasta orden, familia, etc.\nEsta informaci\u00f3n debe ser coherente con la informaci\u00f3n presentada en los otros campos de los metadatos.
datasetfieldtype.taxonRankName.description=Categor\u00eda taxon\u00f3mica del tax\u00f3n.
datasetfieldtype.taxonRankValue.description=Nombre cient\u00edfico del tax\u00f3n sin autor\u00eda.
datasetfieldtype.commonName.description=Nombre com\u00fan del tax\u00f3n.
datasetfieldtype.taxonId.description=Identificador del tax\u00f3n documentado en Nombre cient\u00edfico, seg\u00fan una base de datos que sirve como autoridad taxon\u00f3mica (por ejemplo el \"backbone\" de GBIF, ITIS o la base de datos de plantas del USDA). Este identificador permite referenciar informaci\u00f3n adicional sobre el tax\u00f3n, como las autor\u00edas, el historial de la sinonimia, descripciones publicadas o jerarqu\u00eda de rangos taxon\u00f3micos.
datasetfieldtype.temporalCoverage.description=Grupo de variables para describir los periodos de tiempo cubiertos en los datos.
datasetfieldtype.temporalCoverageType.description=Elija una de las opciones en el cuadro de selecci\u00f3n para establecer el tipo de cobertura temporal, la cual puede consistir de una fecha \u00fanica, un rango de fechas, un periodo de formaci\u00f3n.
datasetfieldtype.simpleCalendarDate.description=Fecha que abarca un d\u00eda (v\u00e1lida si el Tipo de cobertura temporal es \"Fecha \u00fanica\")
datasetfieldtype.initialCalendarDate.description=Fecha en que comienza la cobertura (v\u00e1lida si el tipo de cobertura temporal es \"Rango de fechas\")
datasetfieldtype.finalCalendarDate.description=Fecha en que finaliza la cobertura (v\u00e1lida si el tipo de cobertura temporal es \"Rango de fechas\")
datasetfieldtype.formationPeriod.description=Texto que decribe el periodo de formaci\u00f3n.
datasetfieldtype.emlMethod.description=Describa los m\u00e9todos de muestreo utilizados para obtener los datos proporcionados en el recurso.
datasetfieldtype.emlMethodStudyArea.description=Describa el \u00e1rea de muestreo espec\u00edfica.
datasetfieldtype.emlMethodsSampling.description=Descripci\u00f3n general de los protocolos de muestreo usados para originar los datos del recurso.
datasetfieldtype.emlMethodQualityControl.description=Una descripci\u00f3n de las acciones tomadas para controlar o evaluar la calidad de los datos que resultan de la secci\u00f3n \"Metodolog\u00eda paso a paso\", incluyendo los detalles de la integridad y el sistema de clasificaci\u00f3n taxon\u00f3mica usado para la identificaci\u00f3n de los taxa.
datasetfieldtype.emlMethodStep.description=Describa la serie de m\u00e9todos y procedimientos utilizados en el estudio, y los pasos que condujeron a la producci\u00f3n de los datos. Cada m\u00e9todo debe ser descrito con el suficiente detalle para, si es necesario, permitir a otros investigadores interpretar y replicar el estudio.
datasetfieldtype.emlMethodStepNumber.description=N\u00famero consecutivo de los pasos metodol\u00f3gicos
datasetfieldtype.emlMethodStepDescription.description=Descripci\u00f3n de una etapa que se constituye como uno de los pasos de la metodolog\u00eda.
datasetfieldtype.collectionData.description=Grupo de variables para describir la colecci\u00f3n o colecciones representadas en los datos.
datasetfieldtype.collectionName.description=Nombre oficial de la colecci\u00f3n en el idioma local.
datasetfieldtype.collectionIdentifier.description=El URI (LSID o URL) de la colecci\u00f3n.
datasetfieldtype.collectionCode.description=El acr\u00f3nimo o iniciales que identifican a la colecci\u00f3n.
datasetfieldtype.specimenPreservationMethod.description=Proceso o t\u00e9cnica utilizada para preservar los ejemplares. Si la colecci\u00f3n tiene m\u00e1s de un m\u00e9todo de preservaci\u00f3n, seleccione el predominante. Para las coleciones vivas, no seleccione ning\u00fan tratamiento.
datasetfieldtype.biologicalBiases.description=Describe los sesgos potenciales del conjunto de datos. Pensando al \"universo\" estudiado, \u00bfcuales son los sesgos espaciales, temporales, estad\u00edsticos, taxon\u00f3micos, biol\u00f3gicos, cientificos que provienen de la metodolog\u00eda particular utilizada para crear este conjunto de datos? \u00bfCuales son los riesgos potenciales en pensar que este conjunto de datos es completo y representativo de su objeto de estudio? Los metodos utilizados para registrar especies pueden tener probabilidad de detecci\u00f3n sesgadas con algunas especies. Por favor documentar ac\u00e1 como esas probabilidadades de detecci\u00f3n podr\u00edan resultar en la subestimaci\u00f3n o sobre-estimaci\u00f3n de algunos grupos taxon\u00f3micos particulares. 
